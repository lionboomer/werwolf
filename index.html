<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werwölfe von Düsterwald</title>
<meta name="description" content="Werwolf-Spielleiter fürs Handy: Rollenvergabe, Nachtphasen, Zufallsereignisse und ein Erzähler mit Stimme. Läuft ohne Anmeldung direkt im Browser.">
<meta name="theme-color" content="#12101a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐺</text></svg>">
<style>
  :root{
    --nacht:#12101a; --nacht-hell:#1c1928; --karte:#241f33; --rand:#3a3350;
    --schrift:#ece8f5; --leise:#a79fc0; --gold:#e8b64c; --blut:#c8434b;
    --gruen:#5fb87a; --blau:#6a9fd4; --lila:#9b7fd4;
    --rund:14px; --schatten:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% -10%,#241f38 0%,var(--nacht) 60%);
    background-attachment:fixed; min-height:100vh;
    color:var(--schrift); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px 14px 48px; max-width:720px; margin:0 auto;
  }
  h1{font-size:1.5rem;margin:.2em 0 .1em;letter-spacing:.01em}
  h2{font-size:1.12rem;margin:1.4em 0 .5em;color:var(--gold)}
  h3{font-size:1rem;margin:1.1em 0 .35em}
  p{margin:.5em 0}
  .unter{color:var(--leise);font-size:.9rem;margin:0 0 1.2em}

  .karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--rund);
         padding:16px;margin:12px 0;box-shadow:var(--schatten)}
  .karte.hell{background:var(--nacht-hell)}
  .karte.warn{border-color:var(--gold);background:#2a2418}
  .karte.blut{border-color:var(--blut);background:#2a1a1d}

  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;
         background:var(--lila);color:#fff;cursor:pointer;transition:filter .15s}
  button:hover:not(:disabled){filter:brightness(1.15)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.gross{width:100%;padding:16px;font-size:1.05rem;margin-top:10px}
  button.zweit{background:#3a3350}
  button.gefahr{background:var(--blut)}
  button.gut{background:var(--gruen)}

  input,select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;
               border:1px solid var(--rand);background:#1a1626;color:var(--schrift)}
  label{display:block;margin:.7em 0 .25em;font-size:.9rem;color:var(--leise)}

  .reihe{display:flex;gap:8px;align-items:center}
  .reihe > *{flex:1}
  .reihe button{flex:0 0 auto}
  .gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

  .spieler{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:5px 0;
           background:#1a1626;border:1px solid var(--rand);border-radius:10px}
  .spieler.tot{opacity:.45;text-decoration:line-through}
  .spieler .sym{font-size:1.3rem}
  .spieler .name{flex:1;font-weight:600}
  .spieler .zusatz{font-size:.8rem;color:var(--leise)}

  .marke{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:20px;
         background:var(--rand);color:var(--schrift);margin-left:6px}
  .marke.wolf{background:#4a2226;color:#ffb3b8}
  .marke.dorf{background:#1f3a29;color:#a8e6bd}
  .marke.solo{background:#3a2f14;color:var(--gold)}

  .ereignis{border-left:4px solid var(--gold);padding:12px 14px;background:#241f14;
            border-radius:0 10px 10px 0;margin:12px 0}
  .ereignis h3{margin:0 0 .3em;color:var(--gold);font-size:.95rem;
               text-transform:uppercase;letter-spacing:.06em}
  .ereignis p{margin:0;font-style:italic}

  .rollenkarte{text-align:center;padding:32px 20px}
  .rollenkarte .sym{font-size:4.5rem;line-height:1}
  .rollenkarte .rname{font-size:1.6rem;font-weight:700;margin:.25em 0}
  .rollenkarte .rtext{color:var(--leise);max-width:34ch;margin:.6em auto 0}

  .protokoll{max-height:300px;overflow-y:auto;font-size:.88rem}
  .protokoll div{padding:5px 0;border-bottom:1px solid #2a2440}
  .protokoll .tod{color:#ff9ba2}
  .protokoll .ereignis-z{color:var(--gold)}
  .protokoll .phase{color:var(--blau);font-weight:600}
  .protokoll .geheim{color:var(--lila)}

  .schalter{display:flex;align-items:center;gap:10px;margin:.6em 0}
  .schalter input{width:auto;flex:0 0 auto;transform:scale(1.25)}
  .schalter label{margin:0;color:var(--schrift)}

  .fuss{margin-top:32px;padding-top:16px;border-top:1px solid var(--rand);
        color:var(--leise);font-size:.82rem;text-align:center}
  .fuss a{color:var(--lila)}
  .versteckt{display:none}
  @media (prefers-reduced-motion:no-preference){
    .karte{animation:auf .25s ease}
    @keyframes auf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

<h1>🐺 Werwölfe von Düsterwald</h1>
<p class="unter">Spielleiter fürs Handy — mit Erzähler, Zufallsereignissen und automatischer Rollenverteilung.</p>

<div id="buehne"></div>

<div class="fuss">
  Ein Gerät reicht für die ganze Runde. Es wird nichts gespeichert und nichts gesendet.<br>
  <a href="https://github.com/lionboomer/werwolf">Quellcode auf GitHub</a>
</div>

<script src="spiel.js"></script>
<script src="oberflaeche.js"></script>
</body>
</html>
